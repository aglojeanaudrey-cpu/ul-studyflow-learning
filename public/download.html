<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Téléchargement · UL StudyFlow</title>
    <link rel="icon" type="image/png" href="/ul_studyflow_icon.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f0f2f5;
        color: #111b21;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        background: #fff;
        border-radius: 24px;
        padding: 32px 24px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        border: 1px solid #e9edef;
      }
      .logo-wrapper {
        width: 88px;
        height: 88px;
        margin: 0 auto 20px;
        border-radius: 24px;
        background: linear-gradient(135deg, #25d366 0%, #075e54 100%);
        padding: 8px;
        box-shadow: 0 8px 24px rgba(7, 94, 84, 0.25);
      }
      .logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        color: #075e54;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        color: #667781;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto 20px;
        border: 4px solid #e9edef;
        border-top-color: #25d366;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 24px;
        background: #25d366;
        color: #075e54;
        font-weight: 700;
        font-size: 14px;
        border-radius: 14px;
        text-decoration: none;
        transition:
          background 0.2s,
          transform 0.1s;
        border: none;
        cursor: pointer;
      }
      .btn:hover {
        background: #1faa54;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .hint {
        margin-top: 16px;
        font-size: 12px;
        color: #8696a0;
        line-height: 1.4;
      }
      .progress-bar {
        width: 100%;
        height: 4px;
        background: #e9edef;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 20px;
      }
      .progress-bar-fill {
        height: 100%;
        background: #25d366;
        width: 0%;
        animation: progress 3s ease-in-out forwards;
      }
      @keyframes progress {
        0% {
          width: 0%;
        }
        60% {
          width: 75%;
        }
        100% {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-wrapper">
        <img src="/ul_studyflow_icon.png" alt="UL StudyFlow" class="logo" />
      </div>
      <h1>Téléchargement de l'APK</h1>
      <p>Préparation de votre installation UL StudyFlow...</p>

      <div class="spinner"></div>

      <a
        id="download-btn"
        href="https://github.com/aglojeanaudrey-cpu/ul-studyflow-learning/releases/download/v3.0.0/Ul-StudyFlow-Learning.apk"
        class="btn"
        rel="noopener"
      >
        ⬇ Télécharger manuellement
      </a>

      <div class="progress-bar">
        <div class="progress-bar-fill"></div>
      </div>

      <p class="hint">
        Si le téléchargement ne démarre pas automatiquement, cliquez sur le
        bouton.
      </p>
    </div>

    <script>
      // Redirection automatique après un court délai (laisse le temps au visuel
      // de s'afficher, et évite le "flash" blanc signalé)
      setTimeout(function () {
        window.location.href =
          "https://github.com/aglojeanaudrey-cpu/ul-studyflow-learning/releases/download/v1.0.0/ul-studyflow-learning.apk";
      }, 800);
    </script>
  </body>
</html>
