<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Téléchargement · UL StudyFlow</title>
  <link rel="icon" type="image/png" href="/ul_studyflow_icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F0F2F5;
      color: #111B21;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #E9EDEF;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: #25D366;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 28px;
      color: #075E54;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #075E54;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #667781;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 20px;
      border: 4px solid #E9EDEF;
      border-top-color: #25D366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      background: #25D366;
      color: #075E54;
      font-weight: 700;
      font-size: 14px;
      border-radius: 14px;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      border: none;
      cursor: pointer;
    }
    .btn:hover { background: #1faa54; }
    .btn:active { transform: scale(0.97); }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #8696A0;
      line-height: 1.4;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #E9EDEF;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 20px;
    }
    .progress-bar-fill {
      height: 100%;
      background: #25D366;
      width: 0%;
      animation: progress 3s ease-in-out forwards;
    }
    @keyframes progress {
      0% { width: 0%; }
      60% { width: 75%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">UL</div>
    <h1>Téléchargement de l'APK</h1>
    <p>Préparation de votre installation UL StudyFlow...</p>

    <div class="spinner"></div>

    <a
      id="download-btn"
      href="https://github.com/aglojeanaudrey-cpu/ul-studyflow-learning/releases/download/v2.0.0/ul-studyflow-Learning.apk"
      class="btn"
      rel="noopener"
    >
      ⬇ Télécharger manuellement
    </a>

    <div class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>

    <p class="hint">
      Si le téléchargement ne démarre pas automatiquement, cliquez sur le bouton.
    </p>
  </div>

  <script>
    // Redirection automatique après un court délai (laisse le temps au visuel
    // de s'afficher, et évite le "flash" blanc signalé)
    setTimeout(function () {
      window.location.href =
        "https://github.com/aglojeanaudrey-cpu/ul-studyflow-learning/releases/download/v1.0.0/ul-studyflow-learning.apk";
    }, 800);
  </script>
</body>
</html>
