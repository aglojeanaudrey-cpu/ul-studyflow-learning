<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable · UL Study Flow Learning</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/webp" href="/ul_studyflow_icon.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --brand-dark: #075e54;
        --brand-mid: #128c7e;
        --brand-accent: #25d366;
        --bg-light: #f0f2f5;
        --text-main: #111b21;
        --text-muted: #667781;
      }

      html,
      body {
        height: 100%;
        font-family:
          "Plus Jakarta Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg-light);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
      }

      .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at 20% 0%,
            rgba(37, 211, 102, 0.08),
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 100%,
            rgba(7, 94, 84, 0.06),
            transparent 50%
          ),
          var(--bg-light);
      }

      /* Logo animé */
      .logo-wrapper {
        width: 96px;
        height: 96px;
        border-radius: 28px;
        background: linear-gradient(
          135deg,
          var(--brand-dark),
          var(--brand-mid)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 40px rgba(7, 94, 84, 0.25);
        margin-bottom: 32px;
        animation: float 3s ease-in-out infinite;
      }

      .logo-wrapper svg {
        width: 52px;
        height: 52px;
        stroke: var(--brand-accent);
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      /* Code 404 */
      .code {
        font-size: clamp(72px, 18vw, 120px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(
          135deg,
          var(--brand-dark) 0%,
          var(--brand-mid) 50%,
          var(--brand-accent) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
      }

      /* Message */
      h1 {
        font-size: clamp(20px, 4vw, 26px);
        font-weight: 800;
        color: var(--brand-dark);
        text-align: center;
        margin-bottom: 12px;
      }

      p {
        font-size: 14px;
        color: var(--text-muted);
        text-align: center;
        max-width: 420px;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      /* Boutons */
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        transition: all 0.2s ease;
        cursor: pointer;
        border: none;
      }

      .btn-primary {
        background: var(--brand-accent);
        color: #ffffff;
        box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(37, 211, 102, 0.45);
      }

      .btn-secondary {
        background: #ffffff;
        color: var(--brand-dark);
        border: 1.5px solid #e9edef;
      }

      .btn-secondary:hover {
        border-color: var(--brand-accent);
        background: #f0fdf4;
      }

      .btn svg {
        width: 16px;
        height: 16px;
        stroke-width: 2.5;
      }

      /* Footer minimal */
      .footer {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: var(--text-muted);
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      .footer strong {
        color: var(--brand-dark);
        font-weight: 700;
      }

      /* Responsive */
      @media (max-width: 480px) {
        .logo-wrapper {
          width: 72px;
          height: 72px;
          border-radius: 22px;
          margin-bottom: 24px;
        }
        .logo-wrapper svg {
          width: 38px;
          height: 38px;
        }
        .actions {
          flex-direction: column;
          width: 100%;
          max-width: 280px;
        }
        .btn {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Logo -->
      <div class="logo-wrapper">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 2 8l10 5 10-5-10-5Z" />
          <path d="M2 12l10 5 10-5" />
          <path d="M2 16l10 5 10-5" />
        </svg>
      </div>

      <!-- Code -->
      <div class="code">404</div>

      <!-- Message -->
      <h1>Cette page n'existe pas</h1>
      <p>
        La page que tu cherches a peut-être été déplacée, supprimée, ou
        l'adresse contient une erreur. Retourne à l'accueil pour continuer ta
        progression sur UL Study Flow.
      </p>

      <!-- Actions -->
      <div class="actions">
        <a href="/" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 12 12 3l9 9" />
            <path d="M5 10v10h14V10" />
          </svg>
          Retour à l'accueil
        </a>
        <a href="/features" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 16v-4" />
            <path d="M12 8h.01" />
          </svg>
          Découvrir la plateforme
        </a>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      © <span id="year"></span> <strong>UL Study Flow Learning</strong> · Lomé,
      Togo
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      // Si l'utilisateur vient de Google, changer le texte
      if (document.referrer.includes("google")) {
        document.querySelector("h1").textContent = "Cette page a été déplacée";
        document.querySelector("p").innerHTML =
          "Cette page n'est plus disponible. Utilise le menu de navigation ou retourne à l'accueil pour trouver ton cours.";
      }
    </script>
  </body>
</html>
